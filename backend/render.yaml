services:
  - type: web
    name: testpilot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend.vercel.app"]'
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: MAX_TOKENS
        value: "4096"
